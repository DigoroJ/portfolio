<nav class="navbar">

  <!-- Logo -->
  <button class="logo" (click)="goHome()" aria-label="Go to home">
    <span class="logo-bracket">&lt;</span>
    <span class="logo-text">JD</span>
    <span class="logo-bracket">/&gt;</span>
  </button>


  <!-- Desktop Navigation -->
  <div class="desktop-menu">

    <button
      [class.active]="home"
      (click)="goHome()">
      Home
    </button>

    <button
      [class.active]="about"
      (click)="goAbout()">
      About
    </button>

    <button
      [class.active]="skills"
      (click)="goSkills()">
      Skills
    </button>

    <button
      [class.active]="education"
      (click)="goEducation()">
      Education
    </button>

    <button
      [class.active]="projects"
      (click)="goProjects()">
      Projects
    </button>

    <button
      [class.active]="contacts"
      (click)="goContacts()">
      Contact
    </button>

    <a
      class="resume-btn"
      href="assets/Joseph Digoro.pdf"
      target="_blank">
      Resume
    </a>

  </div>


  <!-- Mobile Hamburger -->
  <button
    class="hamburger"
    type="button"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen"
    aria-label="Toggle navigation menu">

    <span [class.open]="menuOpen"></span>
    <span [class.open]="menuOpen"></span>
    <span [class.open]="menuOpen"></span>

  </button>

</nav>


<!-- Mobile Menu -->
@if (menuOpen) {

  <div class="mobile-menu">

    <button
      [class.active]="home"
      (click)="goHome()">
      Home
    </button>

    <button
      [class.active]="about"
      (click)="goAbout()">
      About
    </button>

    <button
      [class.active]="skills"
      (click)="goSkills()">
      Skills
    </button>

    <button
      [class.active]="education"
      (click)="goEducation()">
      Education
    </button>

    <button
      [class.active]="projects"
      (click)="goProjects()">
      Projects
    </button>

    <button
      [class.active]="contacts"
      (click)="goContacts()">
      Contact
    </button>

    <a
      class="mobile-resume"
      href="assets/Joseph Digoro.pdf"
      target="_blank"
      (click)="closeMenu()">
      View Resume
    </a>

  </div>

}


<!-- Pages -->

@if (home) {
  <app-home></app-home>
}

@if (about) {
  <app-about></app-about>
}

@if (skills) {
  <app-skills></app-skills>
}

@if (education) {
  <app-education></app-education>
}

@if (projects) {
  <app-projects></app-projects>
}

@if (contacts) {
  <app-contacts></app-contacts>
}

<app-footer></app-footer>
