<section class="contact-page">

  <div class="contact-header">

    <p>GET IN TOUCH</p>

    <h1>
      Let's create<br>
      <em>something.</em>
    </h1>

    <span>
      Tell us about your shoot, wedding or event.
    </span>

  </div>


  <div id="contact-grid" class="contact-grid">

    <div class="contact-info">

      <div>
        <span>EMAIL</span>
        <a href="mailto:masterhbusinesssolutions@gmail.com">
          masterhbusinesssolutions@gmail.com
        </a>
      </div>

      <div>
        <span>PHONE</span>
        <a href="tel:+27609606081">
          +27 60 960 6081
        </a>
      </div>

      <!-- <div>
        <span>SOCIAL</span>
        <p>Instagram · Facebook · TikTok</p>
      </div> -->

    </div>


    <form (ngSubmit)="sendEnquiry()" #contactForm="ngForm">

  <div class="form-row">

    <input
      type="text"
      name="name"
      [(ngModel)]="formData.name"
      placeholder="Your Name"
      required>

    <input
      type="tel"
      name="cellphone"
      [(ngModel)]="formData.cellphone"
      placeholder="Cellphone"
      required>

  </div>


  <select
    name="service"
    [(ngModel)]="formData.service"
    required>

    <option value="" disabled>
      What service do you need?
    </option>

    <option>Photography</option>
    <option>Videography</option>
    <option>Wedding Coverage</option>
    <option>Event Coverage</option>
    <option>Portrait Session</option>
    <option>Brand Photography</option>

  </select>

  <input
      type="email"
      name="email"
      [(ngModel)]="formData.email"
      placeholder="Email Address"
      required>


  <input
    type="date"
    name="date"
    [(ngModel)]="formData.date"
    required>


  <textarea
    name="message"
    [(ngModel)]="formData.message"
    rows="6"
    placeholder="Tell us about your project"
    required>
  </textarea>


  <button
    type="submit"
    [disabled]="contactForm.invalid || sending">

    {{ sending ? 'SENDING...' : 'SEND ENQUIRY →' }}

  </button>

</form>

  </div>

</section>
